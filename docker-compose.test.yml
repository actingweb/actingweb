services:
  dynamodb-test:
    image: amazon/dynamodb-local:latest
    container_name: actingweb-test-dynamodb
    # In memory, like CI: the on-disk database under a host bind mount was
    # never cleared by `down -v`, grew across runs, and parallel runs hit
    # its SQLite lock ("too long waiting for a lock", 30 s read timeouts).
    # -sharedDb keeps one database for every credential and region.
    command: '-jar DynamoDBLocal.jar -sharedDb -inMemory'
    ports:
      - '8001:8000'
    working_dir: /home/dynamodblocal
    networks:
      - test-network

  postgres-test:
    image: postgres:16-alpine
    container_name: actingweb-test-postgres
    environment:
      POSTGRES_USER: actingweb
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: actingweb_test
    ports:
      - '5433:5432'
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actingweb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  test-network:
    driver: bridge
