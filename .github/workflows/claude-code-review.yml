name: Claude Code Review

on:
  pull_request:
    # opened: the automatic review. reopened / ready_for_review: ask for a
    # fresh review on an existing PR (close and reopen it, or flip a draft).
    types: [opened, reopened, ready_for_review]
    # Don't spend review tokens on internal planning docs. `paths-ignore` is
    # safe HERE — unlike tests.yml, this workflow is not a required status
    # check, so a PR that never triggers it is still mergeable.
    #
    # Deliberately narrow: user-facing docs (docs/**, *.rst) still get a review.
    # Widen this list if reviewing prose isn't worth the tokens.
    paths-ignore:
      - 'thoughts/**'
      - 'CLAUDE.md'
      - 'TODO.md'

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required so Claude can post its review via `gh pr comment`
      issues: write # PR comments post to the issues comments endpoint
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history so the reviewer can diff against the base branch.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow Claude to read CI results (test/coverage checks) when reviewing
          additional_permissions: |
            actions: read

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`
            and the files with the Read, Grep and Glob tools.

            Post line-specific findings with
            `mcp__github_inline_comment__create_inline_comment`. Then post
            ONE summary comment as a single plain command, exactly:
            `gh pr comment ${{ github.event.pull_request.number }} --body "<markdown>"`.
            The permission check refuses pipes, heredocs, `$(...)`, `&&`,
            `;` and redirections, so put the whole markdown inline in the
            quoted --body argument (escape any double quotes and backticks).

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # show_full_output: true prints the whole session (including any
          # refused tool calls) to the log. The repository is public, so turn
          # it on only while diagnosing a review that posts nothing.

          claude_args: '--allowed-tools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh run view:*)"'
