name: Tests

on:
  pull_request:
    branches: [ master, main, develop ]

jobs:
  # Classify the PR's changed files so a docs-only PR doesn't pay for the full
  # matrix. Every heavy job below is gated on this job's outputs.
  #
  # Why a filter job and NOT `on.pull_request.paths-ignore`: master requires
  # "Tests (Python 3.11, dynamodb)", "Tests (Python 3.11, postgresql)",
  # "Documentation Build" and "type-check". A workflow skipped by a path filter
  # never creates those check runs at all, so a docs PR would wait forever on
  # statuses that can never report. Moving these filters up to the `on:` block
  # will silently make every docs PR unmergeable.
  #
  # A job skipped by an `if:` condition DOES create its check run (conclusion
  # skipped, which satisfies the requirement) — but ONLY for a job without a
  # matrix. See the long comment on `tests` below: a skipped MATRIX job is not
  # expanded, so it reports under the unexpanded name and the two required
  # per-backend contexts are never created. That is why `type-check` and `docs`
  # are gated at job level and `tests` is gated per step.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Detect changes
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Deliberately NOT `set -e`. A skipped job satisfies a required check,
          # so any failure to classify must fall back to running EVERYTHING —
          # otherwise a broken filter would wave an untested PR through green.
          set -uo pipefail

          run_everything() {
            echo "::warning::$1 — running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            run_everything "Base or head SHA missing"
          fi

          # Three-dot: everything on the PR branch since it diverged from base.
          if ! FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            run_everything "Could not diff $BASE_SHA...$HEAD_SHA"
          fi

          if [ -z "$FILES" ]; then
            run_everything "Empty changed-file list"
          fi

          echo "Changed files:"
          echo "$FILES" | sed 's/^/  /'

          code=false
          docs=false

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # Neither built by Sphinx nor read by any CI step. Note this list
              # is deliberately short: `tests/integration/XDIST_GROUPS.md` must
              # NOT be here, because verify_groups.py parses it during the test
              # job — a Markdown file that is genuinely part of CI.
              thoughts/*|AGENTS.md|CLAUDE.md|TODO.md)
                ;;
              # CHANGELOG.rst is a Sphinx source AND a test input — the same
              # trap as XDIST_GROUPS.md above. tests/test_version_consistency.py
              # asserts its version matches pyproject.toml/__init__.py and that
              # the "Unreleased" section is present, and CLAUDE.md asks every PR
              # to add an entry here. Must come before the *.rst branch: bash
              # `case` takes the first match.
              CHANGELOG.rst)
                code=true
                docs=true
                ;;
              # Sphinx sources. source_suffix is .rst only, so .md under docs/
              # isn't built — but it's still a docs change, and treating it as
              # one costs a docs build, not a 30-minute matrix.
              docs/*|*.rst|conf.py)
                docs=true
                ;;
              # Everything else: code, CI config, packaging, test fixtures.
              # docs=true as well because sphinx.ext.autodoc pulls docstrings
              # out of actingweb/**, so code can break the docs build.
              *)
                code=true
                docs=true
                ;;
            esac
          done <<< "$FILES"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

          {
            echo "### CI scope for this PR"
            echo ""
            echo "| Job group | Will run |"
            echo "| --- | --- |"
            echo "| Tests (both backends) + type-check | \`$code\` |"
            echo "| Documentation Build | \`$docs\` |"
            if [ "$code" = "false" ] && [ "$docs" = "false" ]; then
              echo ""
              echo "Docs-only change with no Sphinx sources touched — all heavy jobs skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    needs: changes
    # NO job-level `if:` here, unlike type-check and docs below. GitHub
    # evaluates a job-level `if:` BEFORE expanding `strategy.matrix`, so a
    # skipped matrix job is never instantiated and its check run is reported
    # under the LITERAL, unexpanded name
    # "Tests (Python ${{ matrix.python-version }}, ${{ matrix.backend }})".
    # The required contexts "Tests (Python 3.11, dynamodb)" and
    # "Tests (Python 3.11, postgresql)" would then never be created at all and
    # would sit pending forever, making every docs-only PR unmergeable.
    # Measured on PR #125, not assumed.
    #
    # So the job always runs and every step is gated instead. The job reports
    # success under the correct expanded name, at the cost of starting the
    # runner and its service containers (~30s) on a docs-only PR.
    # If you add a step here, GATE IT — an unguarded step runs on docs PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [dynamodb, postgresql]
        python-version: ['3.11']

    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.backend }})

    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: actingweb
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: actingweb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v5

      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        if: needs.changes.outputs.code == 'true'
        uses: snok/install-poetry@v1
        with:
          version: 1.7.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        if: needs.changes.outputs.code == 'true'
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.backend }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true' && needs.changes.outputs.code == 'true'
        run: poetry install --no-interaction --with dev --extras "all"

      - name: Run PostgreSQL migrations
        if: matrix.backend == 'postgresql' && needs.changes.outputs.code == 'true'
        run: |
          cd actingweb/db/postgresql
          poetry run alembic upgrade head
        env:
          PG_DB_HOST: localhost
          PG_DB_PORT: 5432
          PG_DB_NAME: actingweb_test
          PG_DB_USER: actingweb
          PG_DB_PASSWORD: testpassword

      - name: Wait for DynamoDB to be ready
        if: matrix.backend == 'dynamodb' && needs.changes.outputs.code == 'true'
        run: |
          echo "Waiting for DynamoDB to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null 2>&1; then
              echo "DynamoDB is ready!"
              exit 0
            fi
            echo "Attempt $i: DynamoDB not ready yet, waiting..."
            sleep 2
          done
          echo "DynamoDB failed to start within 60 seconds"
          exit 1

      - name: Verify xdist groups
        if: needs.changes.outputs.code == 'true'
        run: |
          echo "Verifying xdist group documentation..."
          poetry run python tests/integration/verify_groups.py

      - name: Run all tests in parallel
        if: needs.changes.outputs.code == 'true'
        run: |
          echo "Collecting tests..."
          poetry run pytest tests/ --collect-only -q
          echo "Running all tests (unit + integration) with ${{ matrix.backend }} backend..."
          echo "Note: Benchmark tests are excluded from parallel runs (run separately with 'pytest -m benchmark')"
          # Hang protection (a flaky worker can wedge the whole run at the suite tail):
          #   PYTEST_WATCHDOG_SECONDS (see tests/conftest.py): the PRIMARY guard. A
          #     C-level faulthandler timer in every process dumps all thread stacks
          #     and hard-exits if still alive after N seconds. This is the only thing
          #     that reliably aborts an xdist controller wedge — the controller blocks
          #     in socket recv waiting on an unresponsive worker, so NO test is
          #     "running" and pytest's cooperative --timeout / --session-timeout never
          #     fire (the latter only when the event loop regains control, which the
          #     recv-wedge prevents). N (1500s) sits above the legitimate full-run wall
          #     and below the job's timeout-minutes.
          #   --timeout: cooperative backstop for a single runaway test BODY (300s;
          #     with timeout_func_only=true in pyproject it excludes the slow per-worker
          #     session fixtures — alembic migration + uvicorn — so it can't false-kill).
          #   --max-worker-restart=0: if a worker dies, do NOT spawn a replacement.
          #     Restarting trips a known pytest-xdist loadgroup bug
          #     (KeyError: <WorkerController gwN> in _assign_work_unit) that itself
          #     hangs the controller; failing fast is strictly better here.
          poetry run pytest tests/ \
            -m "not benchmark" \
            -n 4 \
            --dist loadgroup \
            --max-worker-restart=0 \
            --reruns 2 \
            --reruns-delay 5 \
            --timeout=300 \
            --timeout-method=thread \
            -v \
            --tb=short \
            --junitxml=test-results/tests-${{ matrix.backend }}.xml \
            --cov=actingweb \
            --cov-report=xml:coverage-${{ matrix.backend }}.xml \
            --cov-report=html:htmlcov-${{ matrix.backend }}
        env:
          DATABASE_BACKEND: ${{ matrix.backend }}
          # Hard hang-watchdog ceiling (seconds) — see tests/conftest.py. Above the
          # legitimate full-run wall, below this job's timeout-minutes.
          PYTEST_WATCHDOG_SECONDS: 1500
          # DynamoDB settings
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DB_HOST: http://localhost:8000
          AWS_DB_PREFIX: test
          # PostgreSQL settings
          PG_DB_HOST: localhost
          PG_DB_PORT: 5432
          PG_DB_NAME: actingweb_test
          PG_DB_USER: actingweb
          PG_DB_PASSWORD: testpassword
          # Attribute-DELETE diagnostics (postgresql backend only; a no-op on
          # dynamodb). Emits PG_DELETE_DIAG at WARNING with the rowcount, the
          # deleting connection's resolved schema, and a post-commit re-read on a
          # fresh connection. pytest buffers these and prints them only for a
          # FAILING test, so a green run costs two extra queries per attribute
          # delete and no log volume.
          #
          # Here to catch the intermittent "DELETE does not persist" failure that
          # quarantined two assertions in test_trust_oauth_integration.py from
          # 2026-06-15 to 2026-08-15. Drop this once the postgres matrix has been
          # green across enough runs to call it gone —
          # thoughts/todo/2026-06-15-postgres-parallel-delete-not-persisting.md.
          ACTINGWEB_PG_DELETE_DIAGNOSTICS: '1'

      - name: Report test flakiness
        if: always() && needs.changes.outputs.code == 'true'
        run: |
          echo "Analyzing test results for flakiness..."
          if [ -f test-results/tests-${{ matrix.backend }}.xml ]; then
            # Count retried tests (flaky tests that passed on retry)
            RETRIED=$(grep -o 'rerun=' test-results/tests-${{ matrix.backend }}.xml | wc -l || echo 0)
            echo "Flaky tests (passed on retry): $RETRIED"
            if [ "$RETRIED" -gt 0 ]; then
              echo "⚠️ Warning: Found $RETRIED flaky tests that required retry"
            fi
          fi

      - name: Upload test results
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.backend }}
          path: test-results/

      - name: Upload coverage
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.backend }}
          path: htmlcov-${{ matrix.backend }}/

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.code == 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-${{ matrix.backend }}.xml
          flags: ${{ matrix.backend }}
          name: codecov-${{ matrix.backend }}-python-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

  test-summary:
    runs-on: ubuntu-latest
    needs: [changes, tests]
    # always() so the summary still posts when a backend fails, but not when the
    # tests job was skipped — there would be no artifacts to download.
    if: always() && needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: all-test-results/

      - name: Comment PR with test summary
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Function to parse JUnit XML and extract test statistics
            function parseJUnitXML(xmlPath) {
              if (!fs.existsSync(xmlPath)) {
                return null;
              }

              const xmlContent = fs.readFileSync(xmlPath, 'utf8');

              // Count total tests
              const testcaseMatches = xmlContent.match(/<testcase/g);
              const totalTests = testcaseMatches ? testcaseMatches.length : 0;

              // Count failures
              const failureMatches = xmlContent.match(/<failure/g);
              const failures = failureMatches ? failureMatches.length : 0;

              // Count errors
              const errorMatches = xmlContent.match(/<error/g);
              const errors = errorMatches ? errorMatches.length : 0;

              // Count flaky tests (tests with rerun attribute)
              const rerunMatches = xmlContent.match(/rerun="/g);
              const flakyTests = rerunMatches ? rerunMatches.length : 0;

              // Count skipped tests
              const skippedMatches = xmlContent.match(/<skipped/g);
              const skipped = skippedMatches ? skippedMatches.length : 0;

              return {
                total: totalTests,
                passed: totalTests - failures - errors - skipped,
                failures: failures,
                errors: errors,
                skipped: skipped,
                flaky: flakyTests
              };
            }

            let comment = '## 🧪 Test Results Summary\n\n';
            comment += '### Matrix Testing: Both Database Backends\n\n';
            comment += '| Backend | Tests | Passed | Failed | Flaky | Status |\n';
            comment += '|---------|-------|--------|--------|-------|--------|\n';

            const backends = ['dynamodb', 'postgresql'];
            let hasFlakiness = false;

            for (const backend of backends) {
              const xmlPath = `all-test-results/test-results-${backend}/tests-${backend}.xml`;
              const stats = parseJUnitXML(xmlPath);

              if (stats) {
                const statusEmoji = (stats.failures + stats.errors) > 0 ? '❌' : '✅';
                const flakyEmoji = stats.flaky > 0 ? '⚠️' : '✅';

                comment += `| ${backend} | ${stats.total} | ${stats.passed} | ${stats.failures + stats.errors} | ${stats.flaky} ${flakyEmoji} | ${statusEmoji} |\n`;

                if (stats.flaky > 0) {
                  hasFlakiness = true;
                }
              } else {
                comment += `| ${backend} | - | - | - | - | ⚠️ No results |\n`;
              }
            }

            comment += '\n';

            if (hasFlakiness) {
              comment += '### ⚠️ Flakiness Detected\n\n';
              comment += 'Some tests required retry to pass. This may indicate:\n';
              comment += '- Race conditions in parallel execution\n';
              comment += '- External dependency timeouts\n';
              comment += '- Non-deterministic test behavior\n\n';
              comment += 'Please review the workflow logs for details on which tests were retried.\n\n';
            } else {
              comment += '### ✅ No Flakiness Detected\n\n';
              comment += 'All tests passed on first attempt without requiring retries.\n\n';
            }

            comment += '**Notes**:\n';
            comment += '- Each backend is tested independently with 4 parallel workers\n';
            comment += '- Flaky tests are automatically retried up to 2 times (5 second delay)\n';
            comment += '- Full test results and logs are available in workflow check runs\n';
            comment += '- Coverage reports are uploaded to Codecov with backend-specific flags\n';

            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  type-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --with dev --extras "all"

      - name: Run pyright type checking
        run: poetry run pyright actingweb

      - name: Run ruff linting
        run: poetry run ruff check actingweb tests

      - name: Run ruff format check
        run: poetry run ruff format --check actingweb tests

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Documentation Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-docs-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --with dev --extras "all"

      - name: Build documentation
        run: |
          # Build docs with source in root directory (same as 'make html')
          # -W: treat warnings as errors
          # --keep-going: don't stop on first warning, show all
          # Suppress specific warnings that are pre-existing tech debt:
          # - ref.doc: broken document references (planned docs not yet created)
          # - misc.highlighting_failure: code blocks with special syntax ($$, ...)
          # - duplicate object: autodoc duplicates from multiple includes
          poetry run sphinx-build -W --keep-going \
            -D suppress_warnings="ref.doc,misc.highlighting_failure" \
            -b html . _build/html

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: _build/html/
