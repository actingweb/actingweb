# The wire rows: what each recording records and which plan phase may change it.
#
# The only copy of row ownership (thoughts/plans/2026-11-06-subscription-wire-baseline.md,
# "rows.toml is the only copy"). tests/integration/verify_groups.py checks it.
#
# Schema
#
#   [reserved]                       id ranges a later plan may add rows under
#   "<plan slug>" = ["WX1-WX9", ...]
#
#   [rows."<row>"]                   one entry per row (a variant suffix such as
#                                    ".target" or ".subscriber" is part of <row>)
#   test = "<file>::<function>"      the scenario that records it
#   topologies = ["same_host", "two_hosts"]
#                                    optional; when present the row has one file
#                                    per topology, wire/<row>.<topology>.json (the
#                                    transcripts name different hosts), otherwise
#                                    one file, wire/<row>.json. One file serves
#                                    both backends.
#   owners = ["<plan slug>:<phase>"] the phases expected to change the recording;
#                                    any other change to it is a regression
#   exposure = false                 true when the row records data reaching a
#                                    peer that may not read it
#   expected = "..."                 what it records, and what is known to be wrong
#   reason = ["<date> <why the file was written or rewritten> (<plan:phase>)"]
#
# A recording is what the library does, right or wrong. Re-record a row with
# WIRE_RECORD=1 (refused under CI) and add a dated line to its `reason`.

[reserved]
"peer-authorisation-fixes" = ["WA1-WA18", "WT1-WT9"]
"subscription-wire-baseline" = ["WS1-WS9", "WL1-WL17", "WD1-WD20", "WQ1-WQ9", "WC1-WC9", "WM1", "WP1-WP9"]
"attribute-list-v2-port" = ["WD21-WD29", "WL18-WL29"]
"spec-1-5" = ["WS10-WS19", "WL30-WL39", "WA19-WA29"]
"subs-list-cache-lifetime" = ["WM2-WM9"]
"email-as-creator-at-write-time" = ["WE1-WE9"]

